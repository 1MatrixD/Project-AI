name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    name: Backend (integration tests on a fake claude)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: projectai
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: projectai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U projectai -d projectai"
          --health-interval 5s --health-timeout 5s --health-retries 20
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/ci-neo4j-password
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
          NEO4J_dbms_memory_heap_max__size: 1G
        ports: ["7474:7474", "7687:7687"]
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
      qdrant:
        image: qdrant/qdrant:v1.15.5
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # tests read the repository .env for the database passwords; the AI is a fake binary,
      # the embedder is fake too (EMBED_FAKE is set by conftest), so no external services
      - name: Write .env for the test run
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=projectai
          POSTGRES_PASSWORD=ci-postgres
          POSTGRES_DB=projectai
          NEO4J_URI=bolt://localhost:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=ci-neo4j-password
          JWT_SECRET=ci-only-secret-not-for-real-use
          EOF
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q
